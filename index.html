<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Flow</title><link rel="stylesheet" href="style.css">
<main><header><p class="eyebrow">LOCAL-FIRST FOCUS</p><h1>Focus Flow</h1><p>One task. One session. Make progress.</p></header>
<section class="timer"><div id="mode">Focus session</div><strong id="clock">25:00</strong><div class="actions"><button id="toggle">Start</button><button id="reset" class="secondary">Reset</button></div></section>
<section><h2>Today's tasks</h2><form id="task-form"><input id="task-input" maxlength="100" placeholder="Add a task…" required><button>Add</button></form><ul id="tasks"></ul></section>
<footer>Tasks stay in this browser using local storage.</footer></main><script src="app.js"></script></html>
